name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    name: Offline checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Read-only checkout without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Synthetic gate unit tests
        run: python3 -B -m unittest discover -s examples -p 'test_*.py' -v
      - name: Synthetic gate, six fixture scenarios
        run: python3 -B examples/fail_closed_gate.py --all
      - name: Snapshot tests (tests that need private files are skipped with a reason)
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Every Python file compiles
        run: python3 -m compileall -q examples scripts tests tools
      - name: Every relative Markdown link resolves
        run: python3 -B tools/check_markdown_links.py
