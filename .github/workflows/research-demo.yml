name: Synthetic research gate — offline checks

on:
  push:
    branches: [main]
    paths: ["examples/**", ".github/workflows/research-demo.yml"]
  pull_request:
    branches: [main]
    paths: ["examples/**", ".github/workflows/research-demo.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read-only checkout without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Verify synthetic gate and negative cases
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B -m unittest discover -s examples -p 'test_*.py' -v
      - name: Reproduce six fixture outcomes
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B examples/fail_closed_gate.py --all
